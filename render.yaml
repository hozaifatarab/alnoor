services:
  - type: web
    name: alnoor
    runtime: python
    plan: free
    # الخطة المجانية: لا تدعم القرص الدائم — نظام الملفات مؤقت.
    buildCommand: pip install -r requirements.txt
    # يعمل التطبيق عبر سيرفر Tornado المدمج في PyWebIO (لا يوجد gunicorn/WSGI في المشروع).
    # يستقبل app.py متغير البيئة PORT تلقائيًا بعد الإصلاح.
    startCommand: python app.py --host 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # بدون INST_DATA_DIR: تُستخدم data/ النسبية داخل المشروع.
      # تحذير الخطة المجانية: قاعدة SQLite والسجلات تُفقد عند كل إعادة نشر/تشغيل.
      - key: INST_PBKDF2_ITERATIONS
        value: "200000"
